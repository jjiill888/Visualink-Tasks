services:
  app:
    build: .
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data        # SQLite 持久化，备份只需备份这个目录
    environment:
      - DB_PATH=/app/data/app.db
      - TZ=Asia/Shanghai
      # 云笔记实时协作（阶段二）。两个变量都来自 gen-auth（见 ysweet 服务注释）；
      # 不想启用协作时删掉这两行即可，编辑页自动回到单人模式
      - Y_SWEET_URL=http://ysweet:8080
      - Y_SWEET_AUTH=${YSWEET_SERVER_TOKEN}
      # 可信内网（ZeroTier）直连模式：浏览器用「访问本服务的同一主机名」+
      # 该端口直连 y-sweet，Go 退出协作数据路径（性能优先）。裸连仍需有效
      # 房间 token（y-sweet 校验）。端口由 .env 的 YSWEET_PUBLIC_PORT 统一
      # 驱动（deploy.sh 首次部署自动探测空闲端口写入）。删掉此行则回落到
      # /collab 反代（多一跳，但多一层登录 session 拦截）
      - Y_SWEET_PUBLIC_PORT=${YSWEET_PUBLIC_PORT:-8081}
    depends_on:
      - ysweet
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/login"]
      interval: 30s
      timeout: 5s
      retries: 3

  # y-sweet：云笔记实时协作的 Yjs CRDT 服务器。
  # 只在 compose 内网暴露（不映射宿主端口）——浏览器一律经 app 的 /collab
  # 反代访问，未登录用户连不上；房间 token 由 app 校验笔记权限后代签。
  #
  # 首次部署前生成密钥对，写入本文件同目录的 .env：
  #   docker run --rm ghcr.io/jamsocket/y-sweet:latest y-sweet gen-auth --json
  #   → private_key  写 YSWEET_PRIVATE_KEY   （y-sweet 的 --auth，校验用）
  #   → server_token 写 YSWEET_SERVER_TOKEN  （app 调 y-sweet 管理 API 的凭据）
  # 注意两者不通用：server_token 由 private_key 派生，串用会 401。
  # command 首项必须是程序名 y-sweet：镜像 entrypoint 不是二进制本身，
  # 省掉会报 exec: "serve": executable file not found（部署实测踩过）。
  ysweet:
    image: ghcr.io/jamsocket/y-sweet:latest
    command: ["y-sweet", "serve", "/data", "--host", "0.0.0.0", "--auth", "${YSWEET_PRIVATE_KEY}", "--prod"]
    ports:
      # 直连模式宿主端口（与 app 的 Y_SWEET_PUBLIC_PORT 同源于 .env，保证一致；
      # 关掉直连时把这两处一起删）
      - "${YSWEET_PUBLIC_PORT:-8081}:8080"
    volumes:
      - ./data/ysweet:/data     # 房间状态落盘，随 ./data 一起备份
    restart: unless-stopped
